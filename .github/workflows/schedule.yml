# Free scheduling: GitHub Actions calls the app on Render.
# Needs two repository secrets: the app's address (e.g. https://job-auto-apply.onrender.com) and the
# cron key (the same value as CRON_SECRET in Render). Named APP_URL and CRON_SECRET, or
# JOBAUTOAPPLY and JOBAUTOAPPLY1 in either order: the one starting with http is the address.
name: Scheduled search and report

on:
  schedule:
    - cron: "5 * * * *" # every hour: searches for anyone due (their chosen cadence), tidy-up, and digest emails
  workflow_dispatch:
    inputs:
      task:
        description: "search (everyone, now) or report (tidy-up and any digests due)"
        default: "search"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S1: ${{ secrets.APP_URL || secrets.JOBAUTOAPPLY }}
      S2: ${{ secrets.CRON_SECRET || secrets.JOBAUTOAPPLY1 }}
    steps:
      - name: Work out which secret is which
        run: |
          case "$S1" in http*) URL="$S1"; KEY="$S2";; *) URL="$S2"; KEY="$S1";; esac
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Missing secrets: add the app address and the cron key"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "APP=${URL%/}" >> "$GITHUB_ENV"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Wake the app (free Render services sleep when idle)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 60 "$APP/api/health" && break
            sleep 20
          done
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # By hand: "search" searches everyone now; "report" runs the tidy-up and digests.
            if [ "${{ github.event.inputs.task }}" = "report" ]; then
              curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $KEY" "$APP/api/cron/report"
            else
              curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $KEY" "$APP/api/cron/search?force=1"
            fi
          else
            # Every hour: search for anyone whose cadence is due, then tidy up and send any digests.
            # A failed search still lets the tidy-up and emails run; the run is marked failed afterwards.
            FAILED=0
            curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $KEY" "$APP/api/cron/search" || FAILED=1
            echo
            curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $KEY" "$APP/api/cron/report" || FAILED=1
            exit $FAILED
          fi
